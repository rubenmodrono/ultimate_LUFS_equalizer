name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS-AppleSilicon
          - os: macos-15-intel
            name: macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pyinstaller --noconfirm packaging/lufs_equalizer.spec
      - name: Comprobar que ffmpeg va dentro
        shell: bash
        run: find dist -iname "ffmpeg*" | grep -q .
      - name: Comprobar la arquitectura (macOS)
        if: runner.os == 'macOS'
        run: file "dist/Ultimate LUFS Equalizer.app/Contents/MacOS/Ultimate LUFS Equalizer"
      # Los artifacts de GitHub pierden los permisos de ejecución, así que la app
      # se empaqueta antes en un zip que los conserva.
      - name: Empaquetar (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Ultimate LUFS Equalizer.app" UltimateLUFSEqualizer-${{ matrix.name }}.zip
      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Ultimate LUFS Equalizer" -DestinationPath UltimateLUFSEqualizer-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: UltimateLUFSEqualizer-${{ matrix.name }}
          path: UltimateLUFSEqualizer-${{ matrix.name }}.zip
